<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="scalpelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded app squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="6" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shield Shape / Surgical Crest -->
  <path d="M256 75 L395 135 C395 285 256 395 256 425 C256 395 117 285 117 135 Z" fill="url(#shieldGrad)" filter="url(#glow)" />
  <path d="M256 95 L375 147 C375 275 256 373 256 400 C256 373 137 275 137 147 Z" fill="#064E3B" opacity="0.35" />

  <!-- Bold Surgical Cross -->
  <path d="M226 160 H286 V220 H346 V280 H286 V340 H226 V280 H166 V220 H226 Z" fill="#FFFFFF" />

  <!-- Stethoscope / Medical Heart Pulse Loop -->
  <path d="M190 250 H220 L235 210 L256 290 L275 230 L290 250 H322" fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Caduceus / Asclepius Rod Emblem -->
  <circle cx="256" cy="180" r="12" fill="#FBBF24" />
  
  <!-- Tiny RU-MED Badge Pill -->
  <rect x="166" y="435" width="180" height="42" rx="21" fill="#0F172A" stroke="#10B981" stroke-width="3" />
  <text x="256" y="463" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#34D399" text-anchor="middle" letter-spacing="2">SURGERY RU</text>
</svg>
